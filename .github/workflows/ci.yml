name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-android:
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-web:
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build web --release
      - run: zip -r web.zip build/web
      - uses: actions/upload-artifact@v4
        with:
          name: web-zip
          path: web.zip

  build-linux:
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: sudo apt-get update -y && sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter build linux --release
      - run: zip -r linux.zip build/linux/x64/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux-zip
          path: linux.zip

  # Windows : non bloquant pour la release tant que le build n'est pas fiabilise.
  # continue-on-error => le run reste vert et la release part sans windows.zip.
  build-windows:
    needs: analyze-test
    continue-on-error: true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter doctor (diagnostic)
        run: flutter doctor -v
      - run: flutter config --enable-windows-desktop
      - run: flutter build windows --release
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: windows.zip
      - name: Diagnostics si echec
        if: failure()
        run: |
          flutter doctor -v
          Write-Host "--- Contenu de build/ ---"
          if (Test-Path build) { Get-ChildItem -Recurse build -Depth 3 | Select-Object -First 60 -ExpandProperty FullName }

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build-android, build-web, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build v${{ github.run_number }}
          body: |
            Build automatique depuis main.
            - APK Android (app-release-apk)
            - Web (web-zip)
            - Linux (linux-zip)
            - Windows : des que le build est fiabilise
          files: |
            app-release-apk/app-release.apk
            web-zip/web.zip
            linux-zip/linux.zip
