name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-android:
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore upload keystore
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_PASS" ]; then
            echo "$KEYSTORE_PASS" | openssl enc -d -aes-256-cbc -pbkdf2 \
              -in android/upload_key.p12.enc \
              -out android/app/upload_key.p12 -pass stdin
            echo "FLUTTER_KEYSTORE_PATH=android/app/upload_key.p12" >> $GITHUB_ENV
            echo "FLUTTER_KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> $GITHUB_ENV
          else
            echo "::warning::Secret KEYSTORE_PASS absent -> signature debug (mises a jour impossibles)"
          fi
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-web:
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build web --release
      - run: zip -r web.zip build/web
      - uses: actions/upload-artifact@v4
        with:
          name: web-zip
          path: web.zip

  build-linux:
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: sudo apt-get update -y && sudo apt-get install -y ninja-build libgtk-3-dev libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: flutter build linux --release
      - run: zip -r linux.zip build/linux/x64/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux-zip
          path: linux.zip

  # Windows est de nouveau fiable (fix STL1011 dans windows/CMakeLists.txt) :
  # il est donc inclus dans la release.
  build-windows:
    needs: analyze-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Flutter doctor (diagnostic)
        run: flutter doctor -v
      - run: flutter config --enable-windows-desktop
      - name: Build Windows (verbose)
        run: |
          flutter build windows --release -v *> build_log.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "--- 60 dernieres lignes du build ---"
            Get-Content build_log.txt -Tail 60
            exit $LASTEXITCODE
          }
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: windows.zip
      - name: Publier le log sur la branche ci-logs
        if: failure()
        shell: bash
        run: |
          tail -c 60000 build_log.txt > build_log_tail.txt
          git config user.email "agent@arena.ai"
          git config user.name "CI Log Bot"
          git checkout --detach
          mv build_log_tail.txt build_log.txt
          git add build_log.txt
          git commit -m "ci: windows build log (run $GITHUB_RUN_NUMBER)"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/ci-logs"

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build-android, build-web, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build v${{ github.run_number }}
          body: |
            Build automatique depuis main.
            - APK Android (app-release-apk)
            - Web (web-zip)
            - Linux (linux-zip)
            - Windows (windows-zip)
          files: |
            app-release-apk/app-release.apk
            web-zip/web.zip
            linux-zip/linux.zip
            windows-zip/windows.zip
