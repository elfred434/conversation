name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-android:
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore upload keystore
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_PASS" ]; then
            echo "$KEYSTORE_PASS" | openssl enc -d -aes-256-cbc -pbkdf2 \
              -in android/upload_key.p12.enc \
              -out android/app/upload_key.p12 -pass stdin
            # Chemin relatif au module android/app (ou Gradle resolve file())
            echo "FLUTTER_KEYSTORE_PATH=upload_key.p12" >> $GITHUB_ENV
            echo "FLUTTER_KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> $GITHUB_ENV
          else
            echo "::warning::Secret KEYSTORE_PASS absent -> signature debug (mises a jour impossibles)"
          fi
      - name: Build APKs (split per ABI + obfuscation)
        run: |
          flutter build apk --release --split-per-abi \
            --build-number=${{ github.run_number }} \
            --obfuscate --split-debug-info=build/symbols
      - uses: actions/upload-artifact@v4
        with:
          name: apk-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-armeabi
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dart-symbols
          path: build/symbols/

  build-web:
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build web --release
      - run: zip -r web.zip build/web
      - uses: actions/upload-artifact@v4
        with:
          name: web-zip
          path: web.zip

  build-linux:
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: sudo apt-get update -y && sudo apt-get install -y ninja-build libgtk-3-dev libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: flutter build linux --release
      - run: zip -r linux.zip build/linux/x64/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux-zip
          path: linux.zip

  # Windows est de nouveau fiable (fix STL1011 dans windows/CMakeLists.txt) :
  # il est donc inclus dans la release.
  build-windows:
    needs: analyze-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Flutter doctor (diagnostic)
        run: flutter doctor -v
      - run: flutter config --enable-windows-desktop
      - name: Build Windows (verbose)
        run: |
          flutter build windows --release -v *> build_log.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "--- 60 dernieres lignes du build ---"
            Get-Content build_log.txt -Tail 60
            exit $LASTEXITCODE
          }
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: windows.zip
      - name: Publier le log sur la branche ci-logs
        if: failure()
        shell: bash
        run: |
          tail -c 60000 build_log.txt > build_log_tail.txt
          git config user.email "agent@arena.ai"
          git config user.name "CI Log Bot"
          git checkout --detach
          mv build_log_tail.txt build_log.txt
          git add build_log.txt
          git commit -m "ci: windows build log (run $GITHUB_RUN_NUMBER)"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/ci-logs"

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build-android, build-web, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Rename artifacts
        run: |
          V=${{ github.run_number }}
          mv apk-arm64/app-arm64-v8a-release.apk      "FluentFlow-v$V-arm64.apk"
          mv apk-armeabi/app-armeabi-v7a-release.apk  "FluentFlow-v$V-arm32.apk"
          mv apk-x86_64/app-x86_64-release.apk        "FluentFlow-v$V-x86_64.apk"
          mv web-zip/web.zip                          "FluentFlow-v$V-web.zip"
          mv linux-zip/linux.zip                      "FluentFlow-v$V-linux.zip"
          mv windows-zip/windows.zip                  "FluentFlow-v$V-windows.zip"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build v${{ github.run_number }}
          body: |
            Build automatique depuis main.

            **Android — choisir selon son téléphone :**
            - `FluentFlow-vX-arm64.apk` → la grande majorité des téléphones depuis 2018 (recommandé)
            - `FluentFlow-vX-arm32.apk` → téléphones 32 bits plus anciens
            - `FluentFlow-vX-x86_64.apk` → émulateurs / Chromebooks

            La voix naturelle est téléchargeable une fois depuis Paramètres (~63 Mo, hors-ligne ensuite).
          files: |
            FluentFlow-v${{ github.run_number }}-arm64.apk
            FluentFlow-v${{ github.run_number }}-arm32.apk
            FluentFlow-v${{ github.run_number }}-x86_64.apk
            FluentFlow-v${{ github.run_number }}-web.zip
            FluentFlow-v${{ github.run_number }}-linux.zip
            FluentFlow-v${{ github.run_number }}-windows.zip
