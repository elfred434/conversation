name: english_conversation_app
description: FluentFlow - A conversational English-learning app built with Flutter (Mobile + Desktop).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.4.9
  # Routing
  go_router: ^13.0.0
  # Networking (LLM streaming)
  http: ^1.1.0
  # Local persistence (user level)
  shared_preferences: ^2.2.2
  # Voice: text-to-speech (read tutor replies) and speech-to-text (voice input)
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  # Neural offline TTS (natural voice, desktop & mobile) + playback + model files
  sherpa_onnx: ^1.13.7
  path_provider: ^2.1.5
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/lessons/

# Generation des icones (android/windows/web) depuis assets/icon/app_icon.png
# Commande : dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#0B1229"
    theme_color: "#2563EB"
